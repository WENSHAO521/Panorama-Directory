<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{{TITLE}} | Panorama Scholarly Group Editorial Directory</title>
    <link rel="icon" href="{{BASE}}assets/logos/favicon.png" type="image/png">
    <link rel="preload" href="{{BASE}}assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{BASE}}assets/fonts/material-symbols-outlined-subset.woff2" as="font" type="font/woff2" crossorigin>
    <link href="{{BASE}}assets/css/site.css" rel="stylesheet"/>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #000000; }
      ::selection { background-color: #000000; color: #ffffff; }

      h1 { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.015em; }

      a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
          outline: 2px solid #000000;
          outline-offset: 3px;
      }
      a:active, button:active { text-decoration: none; }

      main a[href] { transition: transform 150ms ease, background-color 200ms ease, color 200ms ease, border-color 200ms ease; }
      main a[href]:active, main button:active { transform: scale(0.98); }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">
