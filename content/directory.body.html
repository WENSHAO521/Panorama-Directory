<main class="grow pt-24 md:pt-32">
        <section class="max-w-5xl mx-auto px-8 py-12">
            <div class="mb-12">
                <p class="text-gray-500 font-bold tracking-widest text-[10px] uppercase mb-4">Academic Network</p>
                <h1 class="text-4xl md:text-6xl font-extrabold tracking-tighter leading-none mb-12 text-black">Editorial Directory</h1>
                
                <div class="mb-8 border-b border-outline-variant pb-4 overflow-x-auto no-scrollbar">
                    <div class="flex items-center gap-1 min-w-max" id="alphabet-filter">
                        </div>
                </div>

                <div class="bg-surface-variant border border-black p-6 relative max-w-2xl">
                    <div class="flex items-center bg-white border-b border-black pb-1">
                        <span class="material-symbols-outlined text-black mx-3 text-2xl">search</span>
                        <input type="text" id="directory-search" 
                               class="w-full bg-transparent border-none text-lg text-black placeholder-gray-400 font-light px-0 py-2 focus:ring-0 outline-hidden" 
                               placeholder="Filter by name, institution, or keywords...">
                    </div>
                </div>
            </div>

            <div class="border-t border-black pt-12">
                <div class="flex justify-between items-center mb-12">
                    <span id="result-count" class="text-[10px] font-mono text-gray-500 uppercase tracking-widest italic">Loading members...</span>
                </div>

                <div class="space-y-8" id="scholar-list">
                    </div>

                <div class="mt-16 text-center">
                    <button id="load-more-btn" style="display: none;" class="bg-white border border-black text-black px-12 py-4 text-[10px] font-bold uppercase tracking-widest hover:bg-black hover:text-white transition-colors outline-hidden cursor-pointer">
                        Load More Scholars
                    </button>
                </div>
            </div>
        </section>
    </main>
