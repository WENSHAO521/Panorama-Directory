<script>
        const scholarListContainer = document.getElementById('scholar-list');
        const searchInput = document.getElementById('global-search');
        const searchResults = document.getElementById('search-results');
        
        let editorialData = []; 
        const featuredCount = 3; // Number of scholars to show on home page

        // 1. Fetch Data
        fetch('data/scholars.json')
            .then(res => res.json())
            .then(data => {
                editorialData = data;
                renderFeatured(featuredCount);
                initSearch();
            })
            .catch(err => {
                console.error('Data Load Error:', err);
            });

        // 2. Render Featured Scholars
        function renderFeatured(count) {
            const limit = Math.min(count, editorialData.length);
            for (let i = 0; i < limit; i++) {
                const scholar = editorialData[i];
                const imageHTML = (scholar.imagePath && scholar.imagePath.trim() !== "") 
                    ? `<img alt="${scholar.name}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" src="${scholar.imagePath}"/>`
                    : `<div class="w-full h-full flex items-center justify-center bg-gray-100"><span class="material-symbols-outlined text-4xl text-gray-400">person</span></div>`;

                const cardHTML = `
                    <div class="scholar-card border border-outline-variant p-8 hover:border-black transition-colors flex flex-col md:flex-row gap-8 items-start group">
                        <a href="${scholar.profileLink}" class="w-32 h-40 bg-surface-variant shrink-0 border border-outline-variant overflow-hidden block">
                            ${imageHTML}
                        </a>
                        <div class="grow">
                            <a href="${scholar.profileLink}" class="block"><h4 class="text-2xl font-bold text-black mb-2">${scholar.name}</h4></a>
                            <p class="text-xs uppercase tracking-widest text-gray-500 font-bold mb-4">${scholar.affiliation}</p>
                            <p class="text-sm text-gray-600 mb-6 max-w-2xl leading-relaxed font-light">${scholar.bio}</p>
                            <a href="${scholar.profileLink}" class="text-[10px] font-bold uppercase tracking-widest border-b border-black pb-1 hover:text-gray-500 transition-colors">View Academic Profile</a>
                        </div>
                    </div>`;
                scholarListContainer.insertAdjacentHTML('beforeend', cardHTML);
            }
        }

        // 3. Search Logic
        function initSearch() {
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                searchResults.innerHTML = ''; 

                if (query === '') {
                    searchResults.classList.add('hidden');
                    return;
                }

                const matches = editorialData.filter(editor => {
                    const matchName = editor.name.toLowerCase().includes(query);
                    const matchAffiliation = editor.affiliation.toLowerCase().includes(query);
                    const matchKeywords = editor.keywords ? editor.keywords.some(kw => kw.toLowerCase().includes(query)) : false;
                    return matchName || matchAffiliation || matchKeywords;
                });

                if (matches.length > 0) {
                    searchResults.classList.remove('hidden');
                    matches.forEach(match => {
                        const resultItem = document.createElement('a');
                        resultItem.href = match.profileLink;
                        resultItem.className = 'block px-8 py-5 border-b border-outline-variant hover:bg-surface-variant text-black decoration-none';
                        resultItem.innerHTML = `
                            <div class="font-bold text-lg">${match.name}</div>
                            <div class="text-[10px] text-gray-500 uppercase tracking-widest mt-2">${match.affiliation}</div>
                        `;
                        searchResults.appendChild(resultItem);
                    });
                } else {
                    searchResults.classList.remove('hidden');
                    searchResults.innerHTML = '<div class="px-8 py-5 text-sm text-gray-500 italic">No matches found. Try the full Directory.</div>';
                }
            });

            document.addEventListener('click', e => {
                if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                    searchResults.classList.add('hidden');
                }
            });
        }
    </script>
