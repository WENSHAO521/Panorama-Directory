<script>
        const scholarListContainer = document.getElementById('scholar-list');
        const loadMoreBtn = document.getElementById('load-more-btn');
        const searchInput = document.getElementById('directory-search');
        const resultCountLabel = document.getElementById('result-count');
        const alphabetContainer = document.getElementById('alphabet-filter');
        
        let originalData = []; 
        let currentDisplayData = [];
        let currentlyShown = 0;
        const itemsToLoad = 5; 

        // 1. Initialize A-Z Buttons
        function initAlphabetBar() {
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
            let html = `<button class="alpha-btn text-xs font-bold px-3 py-2 border-b-2 border-black text-black outline-hidden transition-colors" data-letter="ALL">ALL</button>`;
            
            letters.forEach(l => {
                html += `<button class="alpha-btn text-xs font-bold px-3 py-2 border-b-2 border-transparent text-gray-400 hover:text-black hover:border-black outline-hidden transition-colors" data-letter="${l}">${l}</button>`;
            });
            alphabetContainer.innerHTML = html;

            // Bind click events
            document.querySelectorAll('.alpha-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Reset styling
                    document.querySelectorAll('.alpha-btn').forEach(b => {
                        b.classList.remove('border-black', 'text-black');
                        b.classList.add('border-transparent', 'text-gray-400');
                    });
                    // Active styling
                    e.target.classList.remove('border-transparent', 'text-gray-400');
                    e.target.classList.add('border-black', 'text-black');

                    // Filter Logic
                    const selectedLetter = e.target.getAttribute('data-letter');
                    searchInput.value = ''; // Clear search bar if using A-Z
                    filterByLetter(selectedLetter);
                });
            });
        }

        // 2. Load Data and Sort Alphabetically
        fetch('data/scholars.json')
            .then(res => res.json())
            .then(data => {
                // Sort array alphabetically by name
                originalData = data.sort((a, b) => a.name.localeCompare(b.name));
                currentDisplayData = [...originalData];
                
                initAlphabetBar();
                updateUI(true);
                initSearch();
            })
            .catch(err => {
                scholarListContainer.innerHTML = '<p class="text-sm italic text-gray-500">Error connecting to directory data.</p>';
            });

        // 3. Filter by Letter
        function filterByLetter(letter) {
            if (letter === 'ALL') {
                currentDisplayData = [...originalData];
            } else {
                currentDisplayData = originalData.filter(scholar => {
                    const nameParts = scholar.name.toUpperCase().split(' ');
                    // Match if first name or last name starts with the letter
                    const matchesFirst = nameParts[0].startsWith(letter);
                    const matchesLast = nameParts.length > 1 ? nameParts[nameParts.length - 1].startsWith(letter) : false;
                    return matchesFirst || matchesLast;
                });
            }
            updateUI(true);
        }

        // 4. Update UI Framework
        function updateUI(reset = false) {
            if (reset) {
                scholarListContainer.innerHTML = '';
                currentlyShown = 0;
            }

            const limit = Math.min(currentlyShown + itemsToLoad, currentDisplayData.length);
            
            if (currentDisplayData.length === 0) {
                scholarListContainer.innerHTML = '<div class="py-12 text-center text-gray-500 italic border border-outline-variant bg-surface-variant">No editorial members found matching this criteria.</div>';
                resultCountLabel.innerText = `0 members found`;
                loadMoreBtn.style.display = 'none';
                return;
            }

            for (let i = currentlyShown; i < limit; i++) {
                const scholar = currentDisplayData[i];
                const imageHTML = (scholar.imagePath && scholar.imagePath.trim() !== "") 
                    ? `<img alt="${scholar.name}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" src="${scholar.imagePath}"/>`
                    : `<div class="w-full h-full flex items-center justify-center bg-gray-100 transition-colors group-hover:bg-gray-200"><span class="material-symbols-outlined text-4xl text-gray-400">person</span></div>`;

                const cardHTML = `
                    <div class="scholar-card border border-outline-variant p-8 hover:border-black transition-colors flex flex-col md:flex-row gap-8 items-start group">
                        <a href="${scholar.profileLink}" class="w-32 h-40 bg-surface-variant shrink-0 border border-outline-variant overflow-hidden block outline-hidden">
                            ${imageHTML}
                        </a>
                        <div class="grow">
                            <a href="${scholar.profileLink}" class="block outline-hidden"><h4 class="text-2xl font-bold text-black mb-2">${scholar.name}</h4></a>
                            <p class="text-xs uppercase tracking-widest text-gray-500 font-bold mb-4">${scholar.affiliation}</p>
                            <p class="text-sm text-gray-600 mb-6 max-w-2xl leading-relaxed font-light">${scholar.bio}</p>
                            <a href="${scholar.profileLink}" class="text-[10px] font-bold uppercase tracking-widest border-b border-black pb-1 hover:text-gray-500 transition-colors outline-hidden">Full Academic Profile</a>
                        </div>
                    </div>`;
                scholarListContainer.insertAdjacentHTML('beforeend', cardHTML);
            }
            
            currentlyShown = limit;
            resultCountLabel.innerText = `Showing ${currentlyShown} of ${currentDisplayData.length} editorial members`;
            loadMoreBtn.style.display = currentlyShown < currentDisplayData.length ? 'inline-block' : 'none';
        }

        loadMoreBtn.addEventListener('click', () => updateUI(false));

        // 5. Search Logic (Overrides A-Z)
        function initSearch() {
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                
                // Reset A-Z visually if user types in search
                document.querySelectorAll('.alpha-btn').forEach(b => {
                    b.classList.remove('border-black', 'text-black');
                    b.classList.add('border-transparent', 'text-gray-400');
                });
                document.querySelector('[data-letter="ALL"]').classList.add('border-black', 'text-black');
                document.querySelector('[data-letter="ALL"]').classList.remove('border-transparent', 'text-gray-400');

                if (query === '') {
                    currentDisplayData = [...originalData];
                } else {
                    currentDisplayData = originalData.filter(ed => 
                        ed.name.toLowerCase().includes(query) || 
                        ed.affiliation.toLowerCase().includes(query) || 
                        (ed.keywords && ed.keywords.some(kw => kw.toLowerCase().includes(query)))
                    );
                }
                updateUI(true);
            });
        }
    </script>
